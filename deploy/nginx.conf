# File: deploy/nginx.conf
# Cấu hình máy chủ ảo (Server Block) cho Nginx + PHP-FPM + SSL Let's Encrypt trên Ubuntu VPS

# 1. Tự động chuyển hướng cổng 80 (HTTP) sang cổng 443 (HTTPS)
server {
    listen 80;
    server_name deploytrack-demo.id.vn www.deploytrack-demo.id.vn;
    return 301 https://$host$request_uri;
}

# 2. Khối máy chủ chính chạy trên cổng 443 (HTTPS - Mã hóa SSL/TLS)
server {
    listen 443 ssl http2;
    server_name deploytrack-demo.id.vn www.deploytrack-demo.id.vn;

    root /var/www/deploytrack;
    index index.html index.php;

    # Đường dẫn tới chứng chỉ số SSL được cấp bởi Let's Encrypt (Certbot)
    ssl_certificate /etc/letsencrypt/live/deploytrack-demo.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deploytrack-demo.id.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Chặn truy cập vào các file cấu hình ẩn (.env, .htaccess, .git)
    location ~ /\.(env|ht|git) {
        deny all;
    }

    # Chuyển các file có đuôi .php sang tiến trình PHP-FPM xử lý
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
